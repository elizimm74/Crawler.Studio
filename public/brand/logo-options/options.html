<!doctype html>
<!-- Four new logo directions for Crawler. Render: node scripts/render-logo-options.cjs -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box} body{background:#0b0b0b;font-family:"Geist Mono",monospace;color:#fff}
  .grid{display:grid;grid-template-columns:repeat(4,420px);gap:24px;padding:32px}
  .opt{border-radius:24px;overflow:hidden;background:#141414}
  .hero{height:300px;display:flex;align-items:center;justify-content:center;background:#1a2aa6}
  .row{display:flex;gap:16px;align-items:center;justify-content:center;padding:20px;background:#000}
  .app{width:72px;height:72px;border-radius:18px;display:flex;align-items:center;justify-content:center}
  .tiny{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center}
  .name{padding:16px 20px;font-size:14px;display:flex;justify-content:space-between}
  .word{font-family:Archivo;font-weight:900;letter-spacing:-.06em;font-size:30px;color:#fff}
</style></head><body><div class="grid" id="g"></div>
<script>
// A: "Claw C"  three crescents bent into a letter C
const A = (c) => `<svg viewBox="0 0 120 120" width="100%" height="100%"><g fill="${c}">
  <path d="M86 22 C 50 4, 12 30, 18 66 C 22 92, 54 112, 90 98 C 58 104, 32 86, 32 62 C 32 36, 58 20, 86 22 Z"/>
  <path d="M90 40 C 68 30, 46 44, 46 62 C 46 80, 66 92, 90 82 C 74 84, 60 74, 60 62 C 60 50, 72 40, 90 40 Z"/>
  <circle cx="96" cy="61" r="6"/></g></svg>`;
// B: "Scratched tile"  three claw slashes torn through a solid square
const B = (fg, bg) => `<svg viewBox="0 0 120 120" width="100%" height="100%"><defs><mask id="m${fg.slice(1)}${bg.slice(1)}"><rect width="120" height="120" fill="#fff"/>
  <g fill="#000" transform="rotate(-24 60 60)"><path d="M30 6 C 40 40, 40 80, 32 116 L 36 116 C 48 80, 48 40, 34 6 Z"/><path d="M58 0 C 70 40, 70 80, 60 120 L 66 120 C 80 80, 80 40, 64 0 Z"/><path d="M86 6 C 96 40, 96 80, 88 116 L 92 116 C 104 80, 104 40, 90 6 Z"/></g></mask></defs>
  <rect x="10" y="10" width="100" height="100" rx="26" fill="${fg}" mask="url(#m${fg.slice(1)}${bg.slice(1)})"/></svg>`;
// C: "Cursor + claws"  a pointer with three scratches trailing behind it (a web crawler that scratches)
const C = (c) => `<svg viewBox="0 0 120 120" width="100%" height="100%"><g fill="${c}">
  <path d="M62 30 L 62 98 L 78 82 L 90 106 L 100 101 L 88 77 L 110 77 Z"/>
  <g transform="rotate(20 40 60)"><path d="M14 30 C 22 50, 22 72, 16 92 C 30 72, 30 50, 14 30 Z"/><path d="M30 22 C 40 48, 40 76, 32 100 C 48 76, 48 48, 30 22 Z"/><path d="M46 34 C 54 54, 54 74, 48 92 C 62 74, 62 54, 46 34 Z"/></g></g></svg>`;
// D: "Slashed wordmark"  lowercase crawler, cut by three claw marks
const D = (c, cut) => `<svg viewBox="0 0 360 120" width="100%" height="100%"><defs><mask id="d${c.slice(1)}${cut.slice(1)}"><rect width="360" height="120" fill="#fff"/>
  <g fill="#000" transform="rotate(20 180 60)"><path d="M140 -20 C 156 40, 156 80, 146 140 L 156 140 C 172 80, 172 40, 152 -20 Z"/><path d="M178 -20 C 194 40, 194 80, 184 140 L 194 140 C 210 80, 210 40, 190 -20 Z"/><path d="M216 -20 C 232 40, 232 80, 222 140 L 232 140 C 248 80, 248 40, 228 -20 Z"/></g></mask></defs>
  <text x="180" y="86" text-anchor="middle" font-family="Archivo" font-weight="900" font-size="92" letter-spacing="-6" fill="${c}" mask="url(#d${c.slice(1)}${cut.slice(1)})">crawler</text></svg>`;
const opts = [
  ["A · claw C", (c)=>A(c), "Three claws bent into a C"],
  ["B · scratched tile", (c,bg)=>B(c,bg||"#1a2aa6"), "A solid tile with claws torn through"],
  ["C · cursor + claws", (c)=>C(c), "A pointer leaving scratch marks"],
  ["D · slashed wordmark", (c)=>D(c,"#1a2aa6"), "The word cut by claws (+ tile B as the icon)"],
];
document.getElementById("g").innerHTML = opts.map(([name, f, note]) => `
  <div class="opt">
    <div class="hero"><div style="width:${name.startsWith("D")?"340px":"200px"};height:${name.startsWith("D")?"120px":"200px"}">${f("#ffffff","#1a2aa6")}</div></div>
    <div class="row">
      <div class="app" style="background:#1a2aa6"><div style="width:46px;height:46px">${name.startsWith("D")?B("#ffffff","#1a2aa6"):f("#ffffff")}</div></div>
      <div class="app" style="background:#fff"><div style="width:46px;height:46px">${name.startsWith("D")?B("#1a2aa6","#fff"):f("#1a2aa6","#fff")}</div></div>
      <div class="tiny" style="background:#1a2aa6"><div style="width:20px;height:20px">${name.startsWith("D")?B("#ffffff","#1a2aa6"):f("#ffffff")}</div></div>
      <span class="word" style="font-size:22px">crawler</span>
    </div>
    <div class="name"><span>${name}</span><span style="color:#9b9b9b">${note}</span></div>
  </div>`).join("");
</script></body></html>
