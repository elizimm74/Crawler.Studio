<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Halo Cap | Halo Studio</title></head>
<body style="font-family:system-ui;padding:24px">
<a href="/cart">Cart</a>
<h1>Halo Cap</h1>
<p>$25.00</p>
<fieldset><legend>Color</legend>
<label><input type="radio" name="c" value="Black" checked> Black</label>
<label><input type="radio" name="c" value="Sand"> Sand</label>
</fieldset>
<form id="f"><input type="submit" value="Add to bag"></form>
<script>
  // Practice store 2: the color is pre-selected, "Add to bag" is a form submit button.
  document.getElementById("f").onsubmit = function (e) {
    e.preventDefault();
    var b = JSON.parse(localStorage.getItem("bag") || "[]");
    b.push({ name: "Halo Cap", size: document.querySelector("input[name=c]:checked").value, price: 25 });
    localStorage.setItem("bag", JSON.stringify(b));
  };
</script>
</body>
</html>
